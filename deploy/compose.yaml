name: haotoday
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: haotoday
      POSTGRES_USER: haotoday
      POSTGRES_PASSWORD: ${PGPASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "haotoday", "-d", "haotoday"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    image: ${APP_IMAGE:?}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?}
      ZHIPUAI_API_KEY: ${ZHIPUAI_API_KEY:-}
      HAOTODAY_VAPID_KEY: ${HAOTODAY_VAPID_KEY:-}
      HAOTODAY_SMTP_HOST: ${HAOTODAY_SMTP_HOST:-}
      HAOTODAY_SMTP_PORT: ${HAOTODAY_SMTP_PORT:-465}
      HAOTODAY_SMTP_USER: ${HAOTODAY_SMTP_USER:-}
      HAOTODAY_SMTP_PASSWORD: ${HAOTODAY_SMTP_PASSWORD:-}
      HAOTODAY_FROM_EMAIL: ${HAOTODAY_FROM_EMAIL:-}
      HAOTODAY_MAIL_ENABLED: ${HAOTODAY_MAIL_ENABLED:-0}
      HAOTODAY_REGISTRATION_OPEN: ${HAOTODAY_REGISTRATION_OPEN:-0}
      HAOTODAY_HTTPS: "1"
      DJANGO_ALLOWED_HOSTS: 8kraw.cloud
      PGHOST: db
      PGDATABASE: haotoday
      PGUSER: haotoday
      PGPASSWORD: ${PGPASSWORD:?}
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PREVIEW_HASH: ${PREVIEW_HASH:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddyconfig:/config
    ports:
      - "80:80"
      - "443:443"
volumes:
  pgdata:
  certificates:
  caddyconfig:
