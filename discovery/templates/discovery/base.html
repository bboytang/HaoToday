<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HaoToday · 今日情报{% endblock %}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#172d29;font:16px/1.65 system-ui,sans-serif}header,main,footer{max-width:54rem;margin:auto;padding:1rem clamp(1rem,4vw,3rem)}header{border-bottom:1px solid #b9c5bf;display:flex;justify-content:space-between;align-items:center}header a{font-weight:800;font-size:1.35rem}a{color:#006452;text-underline-offset:.22em}h1{font-size:clamp(1.9rem,6vw,3.6rem);line-height:1.15;letter-spacing:-.04em}h2{font-size:1.2rem}article{background:white;padding:1.3rem;margin:1rem 0;border-radius:.5rem;border-left:.3rem solid #16765e}small,footer{color:#40574f}.tabs{display:flex;gap:1rem}.tabs a,.go{padding:.5rem .9rem;border:1px solid #527068;border-radius:.4rem}.tabs [aria-current=page],.go{background:#154f43;color:white}.go{display:inline-block}p{overflow-wrap:anywhere}dd{margin:0 0 1rem;white-space:pre-line}dt{font-weight:bold}footer{font-size:.88rem}
.filters{display:flex;flex-wrap:wrap;gap:.7rem;align-items:end;margin:1.2rem 0}.filters label{display:grid;font-size:.86rem}.filters .query{flex:1 1 100%}.filters label:has([type=checkbox]){display:block}.filters input:not([type=checkbox]),.filters select,.filters button{min-height:2.75rem;padding:.45rem .7rem;font:inherit;border:1px solid #82968e;border-radius:.4rem;background:white}.filters button{background:#154f43;color:white;cursor:pointer}
</style></head><body><header><a href="/">HaoToday</a><a href="{% url 'account' %}">我的</a></header><main>{% block body %}{% endblock %}</main><footer>情报依据公开规则整理，以原始参与入口的实际条件为准。</footer></body></html>
