<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"><link rel="apple-touch-icon" href="/icon-192.png"><title>{% block title %}HaoToday · 今日情报{% endblock %}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#172d29;font:16px/1.65 system-ui,sans-serif}header,main,footer{max-width:54rem;margin:auto;padding:1rem clamp(1rem,4vw,3rem)}header{border-bottom:1px solid #b9c5bf;display:flex;justify-content:space-between;align-items:center}header a{font-weight:800;font-size:1.35rem}a{color:#006452;text-underline-offset:.22em}h1{font-size:clamp(1.9rem,6vw,3.6rem);line-height:1.15;letter-spacing:-.04em}h2{font-size:1.2rem}article{background:white;padding:1.3rem;margin:1rem 0;border-radius:.5rem;border-left:.3rem solid #16765e}small,footer{color:#40574f}.tabs{display:flex;gap:1rem}.tabs a,.go{padding:.5rem .9rem;border:1px solid #527068;border-radius:.4rem}.tabs [aria-current=page],.go{background:#154f43;color:white}.go{display:inline-block}p{overflow-wrap:anywhere}dd{margin:0 0 1rem;white-space:pre-line}dt{font-weight:bold}footer{font-size:.88rem}
.filters{display:flex;flex-wrap:wrap;gap:.7rem;align-items:end;margin:1.2rem 0}.filters label{display:grid;font-size:.86rem}.filters .query{flex:1 1 100%}.filters label:has([type=checkbox]){display:block}.filters input:not([type=checkbox]),.filters select,.filters button{min-height:2.75rem;padding:.45rem .7rem;font:inherit;border:1px solid #82968e;border-radius:.4rem;background:white}.filters button{background:#154f43;color:white;cursor:pointer}

.mainnav{display:flex;gap:.35rem}.mainnav a{font-size:1rem;text-decoration:none;padding:.45rem .8rem}.mainnav a[aria-current]{background:#dcebe3;border-radius:.4rem}
.mast{border-top:3px solid #154f43;border-bottom:1px solid #9eb2a9;padding:1.4rem 0}.mast h1{margin:.6rem 0;font-family:serif}.folio{font-weight:650;letter-spacing:.12em}.lead-note{border:1px dashed #81968a;border-radius:.5rem;padding:1.2rem}.lead-note h2{margin-top:0}
@media(max-width:40rem){body{padding-bottom:calc(4.25rem + env(safe-area-inset-bottom))}.mainnav{position:fixed;z-index:3;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:.35rem .5rem calc(.35rem + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #a5b6ac;text-align:center}.mainnav a{min-height:44px;align-content:center}}
</style></head><body><header><a href="{% url 'home' %}">HaoToday</a><nav class="mainnav" aria-label="主导航">
<a href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' and not channel %}aria-current="page"{% endif %}>首页</a>
<a href="{% url 'feed' %}" {% if channel or request.resolver_match.url_name == 'offer' %}aria-current="page"{% endif %}>情报</a>
<a href="{% url 'subscriptions' %}" {% if request.path == '/subscriptions/' %}aria-current="page"{% endif %}>订阅</a>
<a href="{% url 'account' %}" {% if '/account/' in request.path or request.path == '/devices/' or request.path == '/inbox/' %}aria-current="page"{% endif %}>我的</a></nav></header><main>{% block body %}{% endblock %}</main><footer>情报依据公开规则整理，以原始参与入口的实际条件为准。</footer></body></html>
